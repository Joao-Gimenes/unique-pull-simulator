<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unique Pull Simulator</title>
<link rel="icon" type="image/png" referrerpolicy="no-referrer" href="https://static.wikia.nocookie.net/animeadventures/images/5/5c/Trait_Unique.png/revision/latest/scale-to-width-down/64">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120a24; --panel:#1d1238; --panel2:#27184a; --line:#3b2a68;
  --text:#f3eeff; --muted:#a99cc9;
  --rare:#4aa8ff; --epic:#b06bff; --legendary:#ffb62e; --mythic:#ff4d6d;
  --green:#3ddc5a; --pink:#ff5fd2;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,#3a1d6e 0%,var(--bg) 60%) fixed,var(--bg);
  color:var(--text);font-family:Fredoka,system-ui,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:clamp(24px,4vw,34px);margin:0;font-weight:700;letter-spacing:.3px}
h1 span{background:linear-gradient(90deg,#ff5fd2,#ffb62e,#3ddc5a,#4aa8ff,#b06bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin:4px 0 18px;font-size:14px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:0 0 10px;font-weight:600}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:16px}
.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-top:16px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}

/* units */
.units{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.unit{background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:12px 8px;cursor:pointer;
  text-align:center;color:inherit;font:inherit;transition:transform .12s,border-color .12s,box-shadow .12s}
.unit:hover{transform:translateY(-2px)}
.unit.sel{border-color:var(--pink);box-shadow:0 0 0 3px #ff5fd233,0 8px 24px #0006}
.unit .ico{font-size:34px;line-height:1;width:64px;height:64px;margin:0 auto 6px;border-radius:14px;display:grid;place-items:center}
.unit .nm{font-weight:600;font-size:15px}
.unit .ig{font-size:12px;color:var(--muted)}
.unit .rar{display:inline-block;margin-top:6px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:#0004}
.unit .cur{margin-top:6px;font-size:12px;min-height:16px;font-weight:600}

/* reroll stage */
.stage{text-align:center;position:relative;overflow:hidden}
.bar{height:8px;border-radius:99px;margin:-4px -4px 14px;background:linear-gradient(90deg,#ff5fd2,#ffb62e,#3ddc5a,#4aa8ff,#b06bff)}
.slot{display:flex;align-items:center;justify-content:center;gap:14px;min-height:110px;flex-wrap:wrap}
.frame{width:128px;height:128px;border-radius:14px;padding:4px;background:linear-gradient(135deg,#ff3b3b,#ff8a2b,#ff3b6b);box-shadow:0 6px 18px #0008}
.frame .in{position:relative;width:100%;height:100%;border-radius:10px;background:radial-gradient(circle at 50% 35%,#5a1420,#1a0810 75%);overflow:hidden}
.frame .lv{position:absolute;left:7px;top:5px;font-weight:700;font-size:15px;color:#ffe27a;text-shadow:0 2px 0 #000}
.frame .sec{position:absolute;right:7px;top:7px;font-weight:700;font-size:11px;color:#ff6b8a;text-shadow:0 1px 0 #000}
.frame .nm{position:absolute;left:0;right:0;bottom:7px;text-align:center;font-weight:700;font-size:13px;line-height:1.1;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000}
.trait{font-size:clamp(26px,5vw,38px);font-weight:700;text-shadow:0 2px 0 #0008}
img.ti{height:1.25em;width:1.25em;object-fit:contain;vertical-align:-.28em;margin-right:.3em}
.trait img.ti{height:1.5em;width:1.5em;vertical-align:-.4em}
.trait small{display:block;font-size:13px;font-weight:500;color:var(--muted);text-shadow:none}
.trait.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:.3}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.rainbow{background:linear-gradient(90deg,#ff5fd2,#ffb62e,#3ddc5a,#4aa8ff,#b06bff,#ff5fd2);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:slide 2s linear infinite;text-shadow:none}
@keyframes slide{to{background-position:-200% 0}}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
button.b{font:inherit;font-weight:700;font-size:17px;color:#fff;border:0;border-radius:12px;padding:12px 20px;cursor:pointer;
  box-shadow:0 4px 0 #0007;text-shadow:0 2px 0 #0006;transition:transform .06s,box-shadow .06s,filter .1s}
button.b:hover{filter:brightness(1.1)}
button.b:active{transform:translateY(3px);box-shadow:0 1px 0 #0007}
.b.roll{background:linear-gradient(#ff7ae0,#e23fb8);min-width:150px}
.b.auto{background:linear-gradient(#58e374,#27b545)}
.b.auto.on{background:linear-gradient(#ff7a7a,#d93a3a)}
.b.inst{background:linear-gradient(#6fb9ff,#2f7fe0)}
.b.dd{background:linear-gradient(90deg,#ff5fd2,#ffb62e,#3ddc5a,#4aa8ff,#b06bff);font-variant-numeric:tabular-nums}
.b.du{background:linear-gradient(#ffc24a,#f08a1c);font-variant-numeric:tabular-nums}
.b.dd.on,.b.du.on{background:linear-gradient(#ff7a7a,#d93a3a)}
/* controles */
.opts{align-items:center}
.seg{display:inline-flex;background:#150c2b;border:2px solid var(--line);border-radius:99px;padding:3px;gap:2px}
.seg button{font:inherit;font-size:13px;font-weight:600;color:var(--muted);background:none;border:0;border-radius:99px;padding:5px 13px;cursor:pointer;transition:background .15s,color .15s}
.seg button:hover{color:#fff}
.seg button.on{background:linear-gradient(90deg,#ff5fd2,#b06bff);color:#fff;box-shadow:0 2px 8px #ff5fd255}
.sw input{appearance:none;-webkit-appearance:none;flex:none;width:40px;height:22px;border-radius:99px;background:#150c2b;border:2px solid var(--line);position:relative;cursor:pointer;margin:0;transition:background .15s,border-color .15s}
.sw input::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:left .15s,background .15s}
.sw input:checked{background:linear-gradient(90deg,#ff5fd2,#b06bff);border-color:transparent}
.sw input:checked::after{left:20px;background:#fff}
.sw input:focus-visible,.seg button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.sw:hover{color:var(--text)}
*{scrollbar-width:thin;scrollbar-color:#6a4fc0 transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:linear-gradient(#b06bff,#6a4fc0);border-radius:99px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(#ff5fd2,#b06bff)}
button.b:disabled{opacity:.45;cursor:not-allowed;filter:none}
.b.sm{font-size:13px;padding:8px 12px;background:#3b2a68;font-weight:600}
.opts{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:13px}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.hint{font-size:12px;color:var(--muted);margin-top:10px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.st{background:var(--panel2);border-radius:12px;padding:10px 12px}
.st b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.st span{font-size:12px;color:var(--muted)}
.luck{margin-top:10px;background:var(--panel2);border-radius:12px;padding:12px;font-size:14px;line-height:1.45}
.luck b{color:#ffe27a}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:5px 6px;text-align:left;border-bottom:1px solid #ffffff10}
th{color:var(--muted);font-weight:500;font-size:12px}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.log{max-height:230px;overflow:auto;font-size:13px;display:flex;flex-direction:column;gap:4px}
.log div{background:var(--panel2);border-radius:8px;padding:5px 9px;display:flex;justify-content:space-between;gap:8px}
.log em{color:var(--muted);font-style:normal}
.foot{color:var(--muted);font-size:12px;margin-top:18px;line-height:1.5}
.foot a{color:#c9b6ff}

/* ===== Unique celebration ===== */
#fx{position:fixed;inset:0;z-index:50;display:none;overflow:hidden;cursor:pointer}
#fx.on{display:block}
#fx .hue{position:absolute;inset:0;animation:hue 1.6s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#fx .flood{position:absolute;inset:-10%;
  background:radial-gradient(closest-side at 50% 45%,#ff3df0cc 0%,#b12cffb0 35%,#5a18d8a0 65%,#2a0a7a90 100%);
  backdrop-filter:blur(7px) saturate(1.6);-webkit-backdrop-filter:blur(7px) saturate(1.6);
  opacity:0;animation:flood 4s ease forwards}
@keyframes flood{0%{opacity:0}8%{opacity:1}80%{opacity:.95}100%{opacity:0}}
#fx .flash{position:absolute;inset:0;background:#fff;opacity:0;animation:flash .5s ease-out .25s}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
#fx .rays{position:absolute;left:50%;top:45%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;
  background:repeating-conic-gradient(from 0deg,#ffffff38 0 6deg,transparent 6deg 18deg);
  -webkit-mask:radial-gradient(closest-side,#000 0,#000 18%,transparent 62%);mask:radial-gradient(closest-side,#000 0,#000 18%,transparent 62%);
  opacity:0;animation:rays 4s linear forwards}
@keyframes rays{0%{opacity:0;transform:rotate(0) scale(.2)}12%{opacity:1;transform:rotate(20deg) scale(1)}82%{opacity:.9}100%{opacity:0;transform:rotate(150deg) scale(1.1)}}
#fx .center{position:absolute;left:0;right:0;top:45%;transform:translateY(-50%);text-align:center}
#fx .crown{width:min(46vmin,300px);height:auto;overflow:visible;
  filter:drop-shadow(0 0 8px #fffa) drop-shadow(0 0 30px #ff3df0) drop-shadow(0 0 70px #4aa8ffaa);
  transform:scale(0);animation:crown 4s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes crown{0%,10%{transform:scale(0) rotate(-12deg);opacity:0}22%{transform:scale(1.18) rotate(3deg);opacity:1}
  30%{transform:scale(1) rotate(0)}55%{transform:scale(1.06)}80%{transform:scale(1);opacity:1}100%{transform:scale(.25);opacity:0}}
#fx .uq{font-size:clamp(40px,11vmin,84px);font-weight:700;margin-top:.1em;letter-spacing:1px;
  filter:drop-shadow(0 0 12px #fff8) drop-shadow(0 4px 0 #0006);opacity:0;animation:uq 4s ease forwards}
#fx .uq span{background:linear-gradient(90deg,#ff5fd2,#ffb62e,#3ddc5a,#4aa8ff,#b06bff,#ff5fd2);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:slide 1.2s linear infinite}
@keyframes uq{0%,18%{opacity:0;transform:translateY(24px) scale(.7)}28%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:scale(.6)}}
#fx .who{font-size:clamp(15px,3vmin,22px);font-weight:600;color:#fff;opacity:0;animation:uq 4s ease .15s forwards;text-shadow:0 2px 8px #000a}
#fx .rr{position:absolute;left:0;right:0;top:74%;text-align:center;font-size:clamp(26px,6.5vmin,50px);font-weight:700;color:#4dff5e;
  -webkit-text-stroke:2px #0b4d16;paint-order:stroke fill;text-shadow:0 4px 0 #0b4d16,0 0 18px #2bff4a88;
  animation:rr 4s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes rr{0%{transform:scale(.2) rotate(-6deg);opacity:0}7%{transform:scale(1.15) rotate(-3deg);opacity:1}12%{transform:scale(1) rotate(-2deg)}
  55%{opacity:1;transform:scale(1) rotate(-2deg)}70%,100%{opacity:0;transform:scale(1.05) translateY(-10px) rotate(-2deg)}}
#fx .spark{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 12px 4px #fff8;opacity:0;
  animation:spark 1.6s ease-out forwards}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}
body.shake .wrap{animation:shake .45s linear .25s}
@keyframes shake{20%{transform:translate(-7px,4px)}40%{transform:translate(6px,-5px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(4px,3px)}}
@media (prefers-reduced-motion:reduce){#fx .hue{animation-duration:6s}body.shake .wrap{animation:none}#fx .rays{animation:none;opacity:.4}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1><span>Unique</span> Pull Simulator</h1>
    <span class="seg" id="lang" role="group" aria-label="Language"><button data-l="en">EN</button><button data-l="pt">PT</button></span></div>
  <div class="sub" data-i="sub"></div>

  <div class="grid" style="margin-top:0">
    <div>
      <div class="panel stage">
        <div class="bar"></div>
        <div class="slot">
          <div class="frame"><div class="in"><span class="lv">Lv. 110</span><span class="sec">Secret</span>
            <span class="nm">Explosion Mage<br>(Archdemon)</span></div></div>
          <div class="trait" id="trait"></div>
        </div>
        <div class="btns">
          <button class="b roll" id="btnRoll">Reroll</button>
          <button class="b auto" id="btnAuto" data-i="auto"></button>
          <button class="b inst" id="btnInst" data-i="btnInst"></button>
          <button class="b du" id="btnDU" data-i="btnDU"></button>
          <button class="b dd" id="btnDD" data-i="btnDD"></button>
        </div>
        <div class="opts">
          <span style="display:flex;gap:8px;align-items:center"><span data-i="speedLbl"></span>
            <span class="seg" id="speed" role="group"><button data-v="140" data-i="slow"></button><button data-v="60" class="on" data-i="normal"></button><button data-v="16" data-i="fast"></button></span></span>
          <label class="sw"><input type="checkbox" id="sound" checked> <span data-i="sound"></span></label>
          <label class="sw"><input type="checkbox" id="stopMythic"> <span data-i="stopMythic"></span></label>
        </div>
        <div class="hint" data-i="hint"></div>
        <div class="btns"><button class="b sm" id="btnTest" data-i="btnTest"></button><button class="b sm" id="btnReset" data-i="btnReset"></button></div>
      </div>

      <div class="panel" style="margin-top:16px">
        <h2 data-i="hLuck"></h2>
        <div class="stats">
          <div class="st"><b id="sUnit">0</b><span data-i="sUnit"></span></div>
          <div class="st"><b id="sSince">0</b><span data-i="sSince"></span></div>
          <div class="st"><b id="sTotal">0</b><span data-i="sTotal"></span></div>
          <div class="st"><b id="sUniq">0</b><span data-i="sUniq"></span></div>
          <div class="st"><b id="sSinceDU">0</b><span data-i="sSinceDU"></span></div>
          <div class="st"><b id="sDU">0</b><span data-i="sDU"></span></div>
          <div class="st"><b id="sSinceD">0</b><span data-i="sSinceD"></span></div>
          <div class="st"><b id="sDD">0</b><span data-i="sDD"></span></div>
          <div class="st"><b id="sRem">0</b><span data-i="sRem"></span></div>
          <div class="st"><b id="sTok">0</b><span data-i="sTok"></span></div>
        </div>
        <div class="luck" id="luck"></div>
      </div>
    </div>

    <div>
      <div class="panel">
        <h2 data-i="hOdds"></h2>
        <table id="tbl"></table>
      </div>
      <div class="panel" style="margin-top:16px">
        <h2 data-i="hLog"></h2>
        <div class="log" id="log"></div>
      </div>
    </div>
  </div>

  <div class="foot" data-i="foot"></div>
</div>

<div id="fx" aria-hidden="true"></div>

<script>
// ---------- dados (wiki oficial: animeadventures.fandom.com/wiki/Traits) ----------
const TRAITS = [
  {id:'superior', name:'Superior', w:29.97, tier:true,  rar:'rare',      desc:['+10% dano','+12,5% dano','+15% dano']},
  {id:'nimble',   name:'Nimble',   w:24.98, tier:true,  rar:'rare',      desc:['-5% SPA','-7,5% SPA','-12% SPA']},
  {id:'range',    name:'Range',    w:24.98, tier:true,  rar:'rare',      desc:['+10% alcance','+12,5% alcance','+15% alcance']},
  {id:'adept',    name:'Adept',    w:9.99,  rar:'epic',      desc:'+50% XP'},
  {id:'culling',  name:'Culling',  w:5,     rar:'legendary', desc:'+20% dano em inimigos com ≤30% de vida'},
  {id:'sniper',   name:'Sniper',   w:2.5,   rar:'legendary', desc:'+25% alcance'},
  {id:'godspeed', name:'Godspeed', w:1,     rar:'legendary', desc:'-20% SPA'},
  {id:'reaper',   name:'Reaper',   w:0.8,   rar:'mythic',    desc:'+15% dano, +25% dano em bosses'},
  {id:'celestial',name:'Celestial',w:0.36,  rar:'mythic',    desc:'+10% dano, +10% alcance, +20% true damage'},
  {id:'divine',   name:'Divine',   w:0.2,   rar:'mythic',    desc:'+20% dano, -10% SPA, +20% alcance'},
  {id:'golden',   name:'Golden',   w:0.15,  rar:'mythic',    desc:'+30% dano, +20% Yen'},
  {id:'unique',   name:'Unique',   w:0.1,   rar:'unique',    desc:'4x dano (+300%), -10% SPA, +10% alcance · só 1 unit em campo'},
];
const TOTAL_W = TRAITS.reduce((s,t)=>s+t.w,0);          // a wiki soma 100,03 — normalizamos
const DOUBLE_CHANCE = 0.002;                              // 0,2% de trait duplo
const P_UNIQUE_SINGLE = 0.1/TOTAL_W;
const P_DD = DOUBLE_CHANCE*P_UNIQUE_SINGLE**2;             // double Unique: ~1 em 500 milhões
const P_DU = DOUBLE_CHANCE*2*P_UNIQUE_SINGLE*(1-P_UNIQUE_SINGLE);   // Unique + outra trait: ~1 em 250 mil
const P_UNIQUE = (1-DOUBLE_CHANCE)*P_UNIQUE_SINGLE + DOUBLE_CHANCE*(1-(1-P_UNIQUE_SINGLE)**2);
const UNITS = [
  {id:'megumin', name:'Megumin', ig:'Explosion Mage (Archdemon)', rar:'Secret'},
];
const REMNANTS_PER_ROLL = 5;   // Mythical e Secret: 5 Star Remnants por giro
const ROBUX_PER_TOKEN = 90;    // pacote de 50 tokens por 4500 R$
const COLORS = {rare:'var(--rare)',epic:'var(--epic)',legendary:'var(--legendary)',mythic:'var(--mythic)'};
const ROMAN = ['I','II','III'];
const $ = id => document.getElementById(id);

// ---------- idiomas (padrão: inglês) ----------
const WIKI_LINK = `<a href="https://animeadventures.fandom.com/wiki/Traits" target="_blank" rel="noopener">Traits</a>`;
const I18N = {
  en:{
    sub:'Trait reroll simulator — odds from the official Anime Adventures wiki. Unique = 0.1% per roll.',
    noTrait:'No trait', noTraitSub:'roll to start', doubleTag:'DOUBLE TRAIT! ',
    auto:'Auto', stop:'Stop', btnInst:'Until Unique ⚡', btnDU:'Until Unique + another trait 👑➕', btnDD:'Until Double Unique 👑👑',
    speedLbl:'Auto speed', slow:'Slow', normal:'Normal', fast:'Fast', sound:'Sound', stopMythic:'Stop auto on any Mythic',
    hint:'Space = Reroll · Auto always stops when Unique drops',
    btnTest:'Preview Unique animation', btnReset:'Reset everything', resetArm:'Click again to reset',
    hLuck:'Your luck', hOdds:"Odds and what you've rolled", hLog:'Rare traits rolled',
    sUnit:'rolls on this unit', sSince:'rolls since last Unique', sTotal:'total rolls', sUniq:'Uniques obtained',
    sSinceDU:'rolls since last Unique + another trait', sDU:'Unique + another trait obtained',
    sSinceD:'rolls since last Double Unique', sDD:'Double Uniques obtained',
    sRem:'Star Remnants spent (5/roll)', sTok:'or Reroll Tokens (1/roll) ≈ <i id="sRbx">0</i> R$',
    foot:`Odds taken from the ${WIKI_LINK} page of the Anime Adventures wiki (Fandom), including the 0.2% chance of a double trait on each roll. The wiki doesn't list the odds for each tier (I/II/III) of Superior, Nimble and Range, so here the three tiers are equally likely. Fan project, not affiliated with the game's creators; trait icons are loaded from the wiki and the sound is synthesized.`,
    luckAvg:(a,m)=>`On average it takes <b>${a}</b> rolls to get Unique (half of people get it within <b>${m}</b>).`,
    luckLast:(n,p,unit)=>`Your last Unique on ${unit} took <b>${n}</b> rolls — luckier than <b>${p}%</b> of attempts.`,
    luckDry:(n,p)=>`Current dry streak: ${n} rolls. <b>${p}%</b> of people would already have Unique by now.`,
    duTitle:'Unique + another trait',
    duOdds:x=>`: 1 in <b>${x}</b> chance per roll (0.2% double trait with exactly one Unique).`,
    duLast:(n,p,r)=>`The last one took <b>${n}</b> rolls — luckier than <b>${p}%</b> of attempts. That would be <b>${r}</b> Star Remnants.`,
    ddOdds:x=>`: 1 in <b>${x}</b> chance per roll (0.2% double trait × 0.1% Unique × 0.1% Unique).`,
    ddLast:(n,p,r)=>`Your last Double Unique took <b>${n}</b> rolls — luckier than <b>${p}%</b> of attempts. That would be <b>${r}</b> Star Remnants.`,
    thTrait:'Trait', thOdds:'Odds', thGot:'Rolled', thRate:'Your rate', doubleRow:'Double trait',
    logRoll:n=>`roll ${n}`, logEmpty:'Nothing yet. Mythics, Uniques and double traits show up here.',
    testWho:" (test — doesn't count)", progress:x=>`Stop · ${x}M rolls`,
  },
  pt:{
    sub:'Simulador de giros de trait — chances da wiki oficial do Anime Adventures. Unique = 0,1% por giro.',
    noTrait:'Sem trait', noTraitSub:'gire para começar', doubleTag:'TRAIT DUPLO! ',
    auto:'Auto', stop:'Parar', btnInst:'Até o Unique ⚡', btnDU:'Até Unique + outra trait 👑➕', btnDD:'Até o Double Unique 👑👑',
    speedLbl:'Velocidade do auto', slow:'Lento', normal:'Normal', fast:'Rápido', sound:'Som', stopMythic:'Parar o auto em qualquer Mythic',
    hint:'Espaço = Reroll · O auto sempre para quando sai Unique',
    btnTest:'Ver animação do Unique', btnReset:'Zerar tudo', resetArm:'Clique de novo para zerar',
    hLuck:'Sua sorte', hOdds:'Chances e o que já saiu', hLog:'Traits raros que saíram',
    sUnit:'giros nesta unit', sSince:'giros desde o último Unique', sTotal:'giros no total', sUniq:'Uniques pegos',
    sSinceDU:'giros desde o último Unique + outra trait', sDU:'Unique + outra trait pegos',
    sSinceD:'giros desde o último Double Unique', sDD:'Double Uniques pegos',
    sRem:'Star Remnants gastos (5/giro)', sTok:'ou Reroll Tokens (1/giro) ≈ <i id="sRbx">0</i> R$',
    foot:`Chances tiradas da página ${WIKI_LINK} da wiki do Anime Adventures (Fandom), incluindo 0,2% de chance de trait duplo em cada giro. A wiki não informa a chance de cada nível (I/II/III) de Superior, Nimble e Range, então aqui os três níveis têm chance igual. Projeto de fã, sem ligação com os criadores do jogo; os ícones das traits são carregados da wiki e o som é sintetizado.`,
    luckAvg:(a,m)=>`Em média leva <b>${a}</b> giros para sair Unique (metade das pessoas pega em até <b>${m}</b>).`,
    luckLast:(n,p,unit)=>`Seu último Unique na ${unit} saiu em <b>${n}</b> giros — mais sortudo que <b>${p}%</b> das tentativas.`,
    luckDry:(n,p)=>`Seca atual: ${n} giros. <b>${p}%</b> das pessoas já teriam pego o Unique até aqui.`,
    duTitle:'Unique + outra trait',
    duOdds:x=>`: chance de 1 em <b>${x}</b> por giro (trait duplo 0,2% com exatamente um Unique).`,
    duLast:(n,p,r)=>`O último saiu em <b>${n}</b> giros — mais sortudo que <b>${p}%</b> das tentativas. Seriam <b>${r}</b> Star Remnants.`,
    ddOdds:x=>`: chance de 1 em <b>${x}</b> por giro (trait duplo 0,2% × Unique 0,1% × Unique 0,1%).`,
    ddLast:(n,p,r)=>`Seu último Double Unique saiu em <b>${n}</b> giros — mais sortudo que <b>${p}%</b> das tentativas. Seriam <b>${r}</b> Star Remnants.`,
    thTrait:'Trait', thOdds:'Chance', thGot:'Saiu', thRate:'Sua taxa', doubleRow:'Trait duplo',
    logRoll:n=>`giro ${n}`, logEmpty:'Nada ainda. Mythics, Uniques e traits duplos aparecem aqui.',
    testWho:' (teste — não conta)', progress:x=>`Parar · ${x} mi de giros`,
  },
};
const DESC_EN = {
  superior:['+10% damage','+12.5% damage','+15% damage'], nimble:['-5% SPA','-7.5% SPA','-12% SPA'], range:['+10% range','+12.5% range','+15% range'],
  adept:'+50% XP', culling:'+20% damage to enemies at ≤30% health', sniper:'+25% range', godspeed:'-20% SPA',
  reaper:'+15% damage, +25% damage to bosses', celestial:'+10% damage, +10% range, +20% true damage',
  divine:'+20% damage, -10% SPA, +20% range', golden:'+30% damage, +20% Yen',
  unique:'4x damage (+300%), -10% SPA, +10% range · only 1 of the unit placed',
};
let LANG='en'; try{ if(localStorage.getItem('ups-lang')==='pt') LANG='pt'; }catch(e){}
const tx = (k,...a)=>{ const v=I18N[LANG][k]; return typeof v==='function'?v(...a):v; };
const fmt = n => n.toLocaleString(LANG==='pt'?'pt-BR':'en-US');
const dec = (x,d)=>{ const s=x.toFixed(d); return LANG==='pt'?s.replace('.',','):s; };
const pct = w => LANG==='pt'?String(w).replace('.',','):String(w);
const descRaw = id => LANG==='pt'?TRAITS.find(t=>t.id===id).desc:DESC_EN[id];
const descOf = tr => { const d=descRaw(tr.id); return Array.isArray(d)?d[tr.tier-1]:d; };
const descAll = id => { const d=descRaw(id); return Array.isArray(d)?d.join(' / '):d; };
function applyLang(){
  document.documentElement.lang = LANG==='pt'?'pt-BR':'en';
  document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=tx(e.dataset.i));
  $('speed').setAttribute('aria-label',tx('speedLbl'));
  for(const b of $('lang').children) b.classList.toggle('on',b.dataset.l===LANG);
  render();
}

// ---------- estado ----------
const KEY='ups-state-v1';
let S = {sel:'enel', units:{}, counts:{}, doubles:0, log:[]};
try{ const j=JSON.parse(localStorage.getItem(KEY)); if(j&&j.units) S=j; }catch(e){}
const newUnit = ()=>({traits:null, rolls:0, since:0, nUniq:0, lastUniq:0, sinceD:0, dd:[], sinceDU:0, nDU:0, lastDU:0});
S.sel='megumin'; S.units={megumin:S.units.megumin||newUnit()};
{ const u=S.units.megumin;   // migra estado salvo de versões antigas
  u.nUniq ??= u.uniques?.length||0; u.lastUniq ??= u.uniques?.at(-1)||0; u.sinceD ??= u.rolls; u.dd ??= []; delete u.uniques;
  u.sinceDU ??= u.rolls; u.nDU ??= 0; u.lastDU ??= 0; }
S.log=(S.log||[]).filter(l=>l.u==='megumin');
const save = ()=>{ try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} };

// ---------- sorteio ----------
function rollOne(){
  let r=Math.random()*TOTAL_W;
  for(const t of TRAITS){ if((r-=t.w)<0) return {id:t.id, tier:t.tier?1+Math.floor(Math.random()*3):0}; }
  return {id:'superior',tier:1};
}
function rollTraits(){ return Math.random()<DOUBLE_CHANCE ? [rollOne(),rollOne()] : [rollOne()]; }
const T = id => TRAITS.find(t=>t.id===id);
const isRare = tr => ['mythic','unique'].includes(T(tr.id).rar);
function label(tr){ const t=T(tr.id); return t.name+(tr.tier?' '+ROMAN[tr.tier-1]:''); }
function colorOf(tr){ const t=T(tr.id); if(t.tier&&tr.tier===3) return COLORS.epic; return COLORS[t.rar]; }
// ícones das traits, direto da wiki (animeadventures.fandom.com/wiki/Traits)
const ICON_PATH = {superior:'b/bf',nimble:'3/35',range:'a/ad',adept:'f/f6',culling:'2/21',sniper:'f/fb',godspeed:'2/2b',reaper:'d/d9',celestial:'f/f9',divine:'1/14',golden:'1/10',unique:'5/5c'};
const iconURL = id => `https://static.wikia.nocookie.net/animeadventures/images/${ICON_PATH[id]}/Trait_${T(id).name}.png/revision/latest/scale-to-width-down/96`;
const iconHTML = id => `<img class="ti" src="${iconURL(id)}" alt="" referrerpolicy="no-referrer" onerror="this.style.display='none'">`;
function traitHTML(tr){ return iconHTML(tr.id)+(isRare(tr) ? `<span class="rainbow">${label(tr)}</span>` : `<span style="color:${colorOf(tr)}">${label(tr)}</span>`); }

// aplica um giro ao estado (sem mexer na tela); devolve info
function applyRoll(){
  const u=S.units[S.sel], traits=rollTraits();
  u.traits=traits; u.rolls++; u.since++; u.sinceD++; u.sinceDU++;
  if(traits.length===2) S.doubles++;
  for(const tr of traits) S.counts[tr.id]=(S.counts[tr.id]||0)+1;
  const uniq=traits.filter(t=>t.id==='unique').length;
  const rare=traits.some(isRare);
  if(rare||traits.length===2){
    S.log.unshift({u:S.sel,t:traits,n:u.rolls});
    if(S.log.length>60) S.log.length=60;
  }
  let took=0;
  if(uniq){ took=u.since; u.nUniq++; u.lastUniq=took; u.since=0; }
  if(uniq===2){ u.dd.push(u.sinceD); u.sinceD=0; }
  let plus='';
  if(uniq===1&&traits.length===2){ u.nDU++; u.lastDU=u.sinceDU; u.sinceDU=0; plus=label(traits.find(t=>t.id!=='unique')); }
  return {traits,uniq,rare,took,plus};
}

// ---------- render ----------
function render(pop){
  const unit=UNITS.find(x=>x.id===S.sel), u=S.units[S.sel];
  const el=$('trait');
  if(u.traits){
    const d=u.traits.map(descOf).join(' · ');
    el.innerHTML=u.traits.map(traitHTML).join(' + ')+`<small>${u.traits.length===2?tx('doubleTag'):''}${d}</small>`;
  } else el.innerHTML=`${tx('noTrait')}<small>${tx('noTraitSub')}</small>`;
  if(pop){ el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }

  const total=UNITS.reduce((s,x)=>s+S.units[x.id].rolls,0);
  const nUniq=u.nUniq;
  $('sSinceD').textContent=fmt(u.sinceD); $('sDD').textContent=fmt(u.dd.length);
  $('sSinceDU').textContent=fmt(u.sinceDU); $('sDU').textContent=fmt(u.nDU);
  $('sUnit').textContent=fmt(u.rolls); $('sSince').textContent=fmt(u.since);
  $('sTotal').textContent=fmt(total); $('sUniq').textContent=fmt(nUniq);
  $('sRem').textContent=fmt(total*REMNANTS_PER_ROLL); $('sTok').textContent=fmt(total); $('sRbx').textContent=fmt(total*ROBUX_PER_TOKEN);

  // sorte
  const avg=Math.round(1/P_UNIQUE), med=Math.ceil(Math.log(.5)/Math.log(1-P_UNIQUE));
  let h=tx('luckAvg',fmt(avg),fmt(med));
  if(u.nUniq){
    const n=u.lastUniq, worse=(1-P_UNIQUE)**n*100;
    h+='<br>'+tx('luckLast',fmt(n),dec(worse,1),unit.name);
  }
  if(u.since>0){
    const p=(1-(1-P_UNIQUE)**u.since)*100;
    h+='<br>'+tx('luckDry',fmt(u.since),dec(p,1));
  }
  h+=`<br><br><span class="rainbow" style="font-weight:700">${tx('duTitle')}</span>`+tx('duOdds',fmt(Math.round(1/P_DU)));
  if(u.nDU){
    const n=u.lastDU, worse=Math.exp(-P_DU*n)*100;
    h+='<br>'+tx('duLast',fmt(n),dec(worse,1),fmt(n*REMNANTS_PER_ROLL));
  }
  h+=`<br><br><span class="rainbow" style="font-weight:700">Double Unique</span>`+tx('ddOdds',fmt(Math.round(1/P_DD)));
  if(u.dd.length){
    const n=u.dd[u.dd.length-1], worse=Math.exp(-P_DD*n)*100;
    h+='<br>'+tx('ddLast',fmt(n),dec(worse,1),fmt(n*REMNANTS_PER_ROLL));
  }
  $('luck').innerHTML=h;

  // tabela
  const allT=TRAITS.reduce((s,t)=>s+(S.counts[t.id]||0),0);
  $('tbl').innerHTML=`<tr><th>${tx('thTrait')}</th><th class="n">${tx('thOdds')}</th><th class="n">${tx('thGot')}</th><th class="n">${tx('thRate')}</th></tr>`+
    TRAITS.map(t=>{const c=S.counts[t.id]||0;
      return `<tr title="${descAll(t.id)}"><td>${iconHTML(t.id)}${t.rar==='unique'||t.rar==='mythic'?`<span class="rainbow" style="font-weight:700">${t.name}</span>`:`<span style="color:${COLORS[t.rar]};font-weight:600">${t.name}</span>`}</td>
      <td class="n">${pct(t.w)}%</td><td class="n">${fmt(c)}</td>
      <td class="n">${allT?dec(c/allT*100,c&&c/allT<.01?3:2)+'%':'—'}</td></tr>`}).join('')+
    `<tr><td style="color:var(--muted)">${tx('doubleRow')}</td><td class="n">${pct(0.2)}%</td><td class="n">${fmt(S.doubles)}</td><td class="n">${total?dec(S.doubles/total*100,2)+'%':'—'}</td></tr>`;

  $('log').innerHTML=S.log.length?S.log.map(l=>`<div><span>${l.t.map(traitHTML).join(' + ')} <em>· ${UNITS.find(x=>x.id===l.u).name}</em></span><em>${tx('logRoll',fmt(l.n))}</em></div>`).join('')
    :`<div><em>${tx('logEmpty')}</em></div>`;
}

// ---------- som (sintetizado, nada do jogo) ----------
let AC;
function tone(f,t0,d,type='sine',g=.12){
  if(!$('sound').checked) return;
  try{
    AC ??= new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), a=AC.createGain(), t=AC.currentTime+t0;
    o.type=type; o.frequency.value=f; a.gain.setValueAtTime(0,t); a.gain.linearRampToValueAtTime(g,t+.01);
    a.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(a).connect(AC.destination); o.start(t); o.stop(t+d+.02);
  }catch(e){}
}
const sfxRoll = ()=>tone(520+Math.random()*80,0,.07,'triangle',.05);
const sfxMythic = ()=>[660,880,1100].forEach((f,i)=>tone(f,i*.07,.25,'triangle',.1));
function sfxUnique(){
  tone(90,.2,.9,'sawtooth',.16); tone(60,.2,1.1,'sine',.25);
  [523,659,784,1047,1319,1568,2093].forEach((f,i)=>{tone(f,.3+i*.09,.7,'triangle',.11);tone(f*2,.3+i*.09,.5,'sine',.04)});
  [1047,1319,1568].forEach(f=>tone(f,1.1,1.8,'sine',.09));
}

// ---------- animação do Unique ----------
let fxTimer;
const CROWN_URL = iconURL('unique').replace('/96','/512');
const crownPre = new Image(); crownPre.referrerPolicy='no-referrer'; crownPre.src = CROWN_URL;   // pré-carrega
function celebrate(count,unitName,plus){
  const fx=$('fx'); clearTimeout(fxTimer);
  let sparks='';
  for(let i=0;i<34;i++){const a=Math.random()*Math.PI*2, d=30+Math.random()*55;
    sparks+=`<i class="spark" style="left:50%;top:45%;--dx:${Math.cos(a)*d}vmin;--dy:${Math.sin(a)*d}vmin;animation-delay:${.3+Math.random()*.9}s"></i>`;}
  fx.innerHTML=`<div class="hue"><div class="flood"></div><div class="rays"></div>
    <div class="center">
      <img class="crown" alt="" referrerpolicy="no-referrer" src="${CROWN_URL}">
      <div class="uq"><span>${count>1?'Double Unique':plus?'Unique + '+plus:'Unique'}</span></div>
      <div class="who">${unitName}</div>
    </div>${sparks}</div>
    <div class="rr">Rerolled trait!</div><div class="flash"></div>`;
  fx.classList.remove('on'); void fx.offsetWidth; fx.classList.add('on');
  document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake');
  sfxUnique();
  fxTimer=setTimeout(()=>fx.classList.remove('on'),4000);
}
$('fx').onclick=()=>{clearTimeout(fxTimer);$('fx').classList.remove('on')};

// ---------- ações ----------
let autoT=null;
function stopAuto(){ clearInterval(autoT); autoT=null; $('btnAuto').classList.remove('on'); $('btnAuto').textContent=tx('auto'); }
function doRoll(){
  const r=applyRoll(); render(true); save();
  if(r.uniq){ stopAuto(); celebrate(r.uniq,UNITS.find(x=>x.id===S.sel).name,r.plus); }
  else if(r.rare){ sfxMythic(); if(autoT&&$('stopMythic').checked) stopAuto(); }
  else sfxRoll();
}
$('btnRoll').onclick=()=>{ stopAuto(); doRoll(); };
$('btnAuto').onclick=()=>{
  if(autoT) return stopAuto();
  $('btnAuto').classList.add('on'); $('btnAuto').textContent=tx('stop');
  autoT=setInterval(doRoll,speedMs);
};
let speedMs=60;
$('speed').onclick=e=>{ const b=e.target.closest('button'); if(!b) return;
  for(const x of $('speed').children) x.classList.toggle('on',x===b);
  speedMs=+b.dataset.v; if(autoT){ clearInterval(autoT); autoT=setInterval(doRoll,speedMs); } };
$('btnInst').onclick=()=>{
  stopAuto(); let r;
  for(let i=0;i<2e6;i++){ r=applyRoll(); if(r.uniq) break; }
  render(true); save();
  if(r.uniq) celebrate(r.uniq,UNITS.find(x=>x.id===S.sel).name,r.plus);
};
// ---------- até o Double Unique (centenas de milhões de giros, em lotes rápidos) ----------
const CUM=[]; { let a=0; for(const t of TRAITS){ a+=t.w/TOTAL_W; CUM.push(a); } }
const UQ=TRAITS.length-1;
let ddRun=false;
let fastBtn=null;
function setBusy(on){ for(const id of ['btnRoll','btnAuto','btnInst','btnTest','btnReset','btnDD','btnDU']) $(id).disabled=on&&id!==fastBtn; }
function stopDD(){ ddRun=false; if(fastBtn){ $(fastBtn).classList.remove('on'); $(fastBtn).textContent=tx(fastBtn); } fastBtn=null; setBusy(false); render(true); save(); }
// mode 'dd' = dois Uniques no mesmo giro · 'du' = trait duplo com exatamente um Unique
function runFast(mode,id){
  if(ddRun) return stopDD();
  stopAuto(); ddRun=true; fastBtn=id; setBusy(true); $(id).classList.add('on');
  const u=S.units[S.sel], cnt=new Float64Array(TRAITS.length);
  const pick=()=>{ const r=Math.random(); let i=0; while(i<UQ && r>=CUM[i]) i++; return i; };
  let started=0;
  (function chunk(){
    if(!ddRun) return;
    const t0=performance.now(); let hit=false, n=0, dbl=0, since=u.since, nU=0, last=u.lastUniq, sinceDU=u.sinceDU, nDU=0, lastDU=u.lastDU, other=-1;
    cnt.fill(0);
    while(!hit && performance.now()-t0<40){
      for(let k=0;k<200000;k++){
        n++; since++; sinceDU++;
        if(Math.random()<DOUBLE_CHANCE){
          const a=pick(), b=pick(); dbl++; cnt[a]++; cnt[b]++;
          if(a===UQ||b===UQ){ nU++; last=since; since=0;
            if(a===UQ&&b===UQ){ if(mode==='dd'){ hit=true; break; } }
            else { nDU++; lastDU=sinceDU; sinceDU=0; if(mode==='du'){ other=a===UQ?b:a; hit=true; break; } } }
        } else { const a=pick(); cnt[a]++; if(a===UQ){ nU++; last=since; since=0; } }
      }
    }
    u.sinceDU=sinceDU; u.nDU+=nDU; u.lastDU=lastDU;
    u.rolls+=n; u.sinceD+=n; u.since=since; u.nUniq+=nU; u.lastUniq=last; S.doubles+=dbl; started+=n;
    TRAITS.forEach((t,i)=>{ if(cnt[i]) S.counts[t.id]=(S.counts[t.id]||0)+cnt[i]; });
    if(hit){
      if(mode==='dd'){ u.traits=[{id:'unique',tier:0},{id:'unique',tier:0}]; u.dd.push(u.sinceD); u.sinceD=0; }
      else { const t=TRAITS[other]; u.traits=[{id:'unique',tier:0},{id:t.id,tier:t.tier?1+Math.floor(Math.random()*3):0}]; }
      S.log.unshift({u:S.sel,t:u.traits,n:u.rolls}); if(S.log.length>60) S.log.length=60;
      const tr=u.traits; stopDD(); celebrate(mode==='dd'?2:1,UNITS.find(x=>x.id===S.sel).name,mode==='du'?label(tr[1]):''); return;
    }
    $(id).textContent=tx('progress',dec(started/1e6,1));
    $('sUnit').textContent=$('sTotal').textContent=fmt(u.rolls); $('sSinceD').textContent=fmt(u.sinceD); $('sUniq').textContent=fmt(u.nUniq);
    setTimeout(chunk,0);
  })();
}
$('btnDD').onclick=()=>runFast('dd','btnDD');
$('btnDU').onclick=()=>runFast('du','btnDU');
$('btnTest').onclick=()=>celebrate(1,UNITS.find(x=>x.id===S.sel).name+tx('testWho'));
let resetArm=null;
$('btnReset').onclick=()=>{
  const b=$('btnReset');
  if(!resetArm){ b.textContent=tx('resetArm'); b.style.background='#d93a3a';
    resetArm=setTimeout(()=>{resetArm=null;b.textContent=tx('btnReset');b.style.background=''},3000); return; }
  clearTimeout(resetArm); resetArm=null; b.textContent=tx('btnReset'); b.style.background='';
  stopAuto(); const sel=S.sel; S={sel,units:{},counts:{},doubles:0,log:[]};
  for(const u of UNITS) S.units[u.id]=newUnit(); save(); render(); };
addEventListener('keydown',e=>{ if(e.code==='Space'&&!/SELECT|INPUT|BUTTON/.test(e.target.tagName)){ e.preventDefault(); if($('fx').classList.contains('on')) return $('fx').onclick(); if(ddRun) return; stopAuto(); doRoll(); } });
$('lang').onclick=e=>{ const b=e.target.closest('button'); if(!b||b.dataset.l===LANG) return;
  stopAuto(); if(ddRun) stopDD();
  if(resetArm){ clearTimeout(resetArm); resetArm=null; $('btnReset').style.background=''; }
  LANG=b.dataset.l; try{localStorage.setItem('ups-lang',LANG)}catch(e){} applyLang(); };
applyLang();
</script>
